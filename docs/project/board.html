<title>Traveo Portfolio Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --ground: #F2F5F3;
    --surface: #FFFFFF;
    --ink: #15201B;
    --muted: #5B6A64;
    --line: #D9E1DC;
    --accent: #1D6B49;
    --accent-soft: #E1EFE7;
    --bench: #B97A06;
    --bench-soft: #FBF0D9;
    --off: #8A9791;
    --today: #1D6B49;
    --font-display: "IBM Plex Sans Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
    --font-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #0E1412;
      --surface: #16201C;
      --ink: #E3ECE7;
      --muted: #93A39C;
      --line: #2A3732;
      --accent: #5CC49A;
      --accent-soft: #1B3328;
      --bench: #E6AE45;
      --bench-soft: #33280F;
      --off: #6F7E77;
      --today: #5CC49A;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #0E1412;
    --surface: #16201C;
    --ink: #E3ECE7;
    --muted: #93A39C;
    --line: #2A3732;
    --accent: #5CC49A;
    --accent-soft: #1B3328;
    --bench: #E6AE45;
    --bench-soft: #33280F;
    --off: #6F7E77;
    --today: #5CC49A;
  }

  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
  }
  .wrap {
    max-width: 960px;
    margin: 0 auto;
    padding-inline: 16px;
    padding-block: 28px 48px;
    display: grid;
    gap: 36px;
  }
  h1, h2, h3 {
    font-family: var(--font-display);
    font-weight: 600;
    line-height: 1.15;
    text-wrap: balance;
    margin: 0;
  }
  h1 { font-size: 30px; letter-spacing: -0.01em; }
  h2 { font-size: 20px; }
  h3 { font-size: 16px; }
  p { margin: 0; }
  code {
    font-family: var(--font-mono);
    font-size: 0.88em;
    background: var(--accent-soft);
    padding: 1px 5px;
    border-radius: 4px;
    overflow-wrap: anywhere;
  }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  section { display: grid; gap: 14px; }
  .section-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }

  /* ---- header + summary strip ---- */
  header { display: grid; gap: 8px; }
  header .sub { color: var(--muted); max-width: 62ch; }
  .strip {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
  }
  .stat {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px 16px;
    display: grid;
    gap: 4px;
    align-content: start;
  }
  .stat .big {
    font-family: var(--font-display);
    font-size: 26px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .stat .note { color: var(--muted); font-size: 13px; }
  .stat.lead { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }

  /* ---- chips ---- */
  .chip {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 999px;
    border: 1px solid currentColor;
    white-space: nowrap;
  }
  .chip.bench { color: var(--bench); background: var(--bench-soft); }
  .chip.off { color: var(--off); }
  .chip.retro { color: var(--accent); background: var(--accent-soft); }
  .chip.work { color: var(--muted); }
  .chip.now { color: var(--today); }

  /* ---- this week ---- */
  .days { display: grid; gap: 8px; }
  .day {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 14px;
    display: grid;
    grid-template-columns: 92px 1fr;
    gap: 4px 14px;
  }
  .day .when { display: grid; gap: 4px; align-content: start; }
  .day .date { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
  .day .dname { font-family: var(--font-display); font-weight: 600; font-size: 17px; }
  .day .body { display: grid; gap: 6px; min-width: 0; }
  .day .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .day.is-off { background: transparent; border-style: dashed; }
  .day.is-off .body { color: var(--muted); }
  .day.is-bench { border-color: color-mix(in srgb, var(--bench) 45%, var(--line)); }
  .day.is-today { border-color: var(--today); box-shadow: 0 0 0 1px var(--today); }
  .day.is-past { opacity: 0.62; }
  @media (max-width: 520px) {
    .day { grid-template-columns: 1fr; }
    .day .when { display: flex; gap: 10px; align-items: baseline; }
  }

  .checklist {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px 16px;
    display: grid;
    gap: 10px;
  }
  .checklist ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .checklist li { display: grid; grid-template-columns: 20px 1fr; gap: 8px; }
  .checklist .box {
    width: 14px; height: 14px; margin-top: 4px;
    border: 1.5px solid var(--bench); border-radius: 3px;
  }
  .checklist .goal { color: var(--muted); font-size: 13.5px; }

  /* ---- calendar ---- */
  .table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
  table { width: 100%; border-collapse: collapse; min-width: 760px; font-size: 14px; }
  th, td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  th { font-family: var(--font-mono); font-size: 11.5px; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
  tbody tr:last-child td { border-bottom: 0; }
  td.wk { font-family: var(--font-mono); font-weight: 500; white-space: nowrap; }
  td.dates { font-family: var(--font-mono); font-size: 13px; color: var(--muted); white-space: nowrap; }
  td.benchcell.has { color: var(--bench); }
  td.benchcell.none { color: var(--off); font-style: italic; }
  td.deliv { font-weight: 600; }
  tr.is-current td { background: var(--accent-soft); }
  tr.is-past td { color: var(--muted); }
  tr.is-milestone td.deliv { color: var(--accent); }
  .buffer-note { color: var(--muted); font-size: 13.5px; max-width: 70ch; }

  /* ---- later + rules ---- */
  .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; }
  ol.rules, ul.plain { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
  ol.rules li::marker { font-family: var(--font-mono); color: var(--muted); }
  .rhythm { display: grid; gap: 6px; }
  .rhythm div { display: grid; grid-template-columns: 70px 64px 1fr; gap: 10px; align-items: baseline; }
  .rhythm .d { font-family: var(--font-mono); font-weight: 500; }
  .rhythm .h { font-family: var(--font-mono); color: var(--muted); font-size: 13px; }

  footer { color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 4px; }
</style>

<script>
(function () {
  var data;
  try { data = JSON.parse(document.getElementById('board-data').textContent); }
  catch (e) { document.getElementById('sub').textContent = 'Board data could not be read.'; return; }

  var DAY = 86400000;
  function parseDate(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  var now = new Date();
  var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  function daysUntil(s) { return Math.round((parseDate(s) - today) / DAY); }
  var WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  var MO = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  /* Render `backtick` spans as <code>, everything else as plain text. */
  function rich(tag, cls, text) {
    var n = el(tag, cls);
    String(text).split('`').forEach(function (part, i) {
      if (!part) return;
      n.appendChild(i % 2 ? el('code', null, part) : document.createTextNode(part));
    });
    return n;
  }
  function chip(kind, label) { return el('span', 'chip ' + kind, label); }

  document.getElementById('sub').textContent = data.subtitle;

  /* ---- summary strip ---- */
  var strip = document.getElementById('strip');
  function stat(label, big, note, lead) {
    var s = el('div', 'stat' + (lead ? ' lead' : ''));
    s.appendChild(el('span', 'eyebrow', label));
    s.appendChild(el('span', 'big', big));
    if (note) s.appendChild(rich('span', 'note', note));
    strip.appendChild(s);
  }
  function countdown(dateStr) {
    var n = daysUntil(dateStr);
    if (n > 1) return n + ' days';
    if (n === 1) return 'Tomorrow';
    if (n === 0) return 'Today';
    return 'Passed';
  }
  var rd = parseDate(data.readyToApply), js = parseDate(data.jobSearch);
  stat('This week delivers', data.week.code.split(' ')[0], data.week.delivery, true);
  stat('Ready to apply', countdown(data.readyToApply), WD[rd.getDay()] + ' ' + MO[rd.getMonth()] + ' ' + rd.getDate() + ' — README, index post, M5a post live');
  stat('Job search opens', countdown(data.jobSearch), MO[js.getMonth()] + ' ' + js.getDate() + ' · window runs to Feb 2027');

  /* ---- this week ---- */
  document.getElementById('week-code').textContent = data.week.code + ' · budget ' + data.week.budget;
  document.getElementById('week-title').textContent = data.week.title;
  var days = document.getElementById('days');
  var KIND = { bench: ['bench', 'Bench'], off: ['off', 'Off'], retro: ['retro', 'Retro'], work: ['work', 'No board'] };
  data.week.days.forEach(function (d) {
    var dt = parseDate(d.date);
    var diff = Math.round((dt - today) / DAY);
    var row = el('article', 'day is-' + d.kind + (diff === 0 ? ' is-today' : '') + (diff < 0 ? ' is-past' : ''));
    var when = el('div', 'when');
    when.appendChild(el('span', 'dname', WD[dt.getDay()]));
    when.appendChild(el('span', 'date', MO[dt.getMonth()] + ' ' + dt.getDate()));
    row.appendChild(when);
    var body = el('div', 'body');
    var meta = el('div', 'meta');
    var k = KIND[d.kind] || KIND.work;
    meta.appendChild(chip(k[0], k[1]));
    if (d.hours && d.hours !== '—') meta.appendChild(el('span', 'mono date', d.hours));
    if (diff === 0) meta.appendChild(chip('now', 'Today'));
    body.appendChild(meta);
    body.appendChild(rich('p', null, d.task));
    row.appendChild(body);
    days.appendChild(row);
  });

  var cl = document.getElementById('checklist');
  if (data.week.checklist) {
    cl.appendChild(el('h3', null, data.week.checklist.title));
    cl.appendChild(el('p', 'goal', data.week.checklist.goal));
    var ul = el('ul');
    data.week.checklist.items.forEach(function (t) {
      var li = el('li');
      li.appendChild(el('span', 'box'));
      li.appendChild(rich('span', null, t));
      ul.appendChild(li);
    });
    cl.appendChild(ul);
  } else { cl.hidden = true; }

  /* ---- calendar ---- */
  var cal = document.getElementById('cal');
  function fmtRange(a, b) {
    var x = parseDate(a), y = parseDate(b);
    return MO[x.getMonth()] + ' ' + x.getDate() + '–' + (x.getMonth() === y.getMonth() ? '' : MO[y.getMonth()] + ' ') + y.getDate();
  }
  data.calendar.forEach(function (w) {
    var s = parseDate(w.start), e = parseDate(w.end);
    var cls = [];
    if (today >= s && today <= e) cls.push('is-current');
    else if (today > e) cls.push('is-past');
    if (w.milestone) cls.push('is-milestone');
    var tr = el('tr', cls.join(' '));
    tr.appendChild(el('td', 'wk', w.w));
    tr.appendChild(el('td', 'dates', fmtRange(w.start, w.end)));
    tr.appendChild(rich('td', null, w.focus));
    tr.appendChild(el('td', 'benchcell ' + (w.bench ? 'has' : 'none'), w.bench || 'Rest'));
    var dc = el('td', 'deliv');
    if (w.delivery) dc.textContent = (w.milestone ? '✓ ' : '') + w.delivery;
    else { dc.textContent = '—'; dc.style.color = 'var(--off)'; dc.style.fontWeight = '400'; }
    tr.appendChild(dc);
    cal.appendChild(tr);
  });
  document.getElementById('buffer-note').textContent = data.bufferNote;

  /* ---- later, rhythm, rules ---- */
  var later = document.getElementById('later');
  data.later.forEach(function (t) { later.appendChild(rich('li', null, t)); });
  var rh = document.getElementById('rhythm');
  data.rhythm.forEach(function (r) {
    var d = el('div');
    d.appendChild(el('span', 'd', r.d));
    d.appendChild(el('span', 'h', r.h));
    d.appendChild(el('span', null, r.what));
    rh.appendChild(d);
  });
  var rules = document.getElementById('rules');
  data.rules.forEach(function (t) { rules.appendChild(rich('li', null, t)); });

  var f = document.getElementById('footer');
  f.appendChild(rich('span', null, 'Source of truth: `' + data.source + '` in the repo. This page is a view of it.'));
  f.appendChild(el('span', null, 'Rebuilt ' + data.rebuilt + ' · rebuilt every Sunday at 10:00 by the retro task.'));
})();
</script>
