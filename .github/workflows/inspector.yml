name: inspector

# The Inspector (docs/design/agent-pipeline.md section 2; ADR-0026). No trigger of its own:
# the Dispatcher calls it when a CR's host CI is green (routing rows 3 and 3b).
#
#   review  the agent: fresh context, read-only tools, scripted test-first evidence (OAuth token only)
#   post    posts the review as a COMMENT with the Reviewer App token, and returns the verdict
#
# Write is allowed for its report only in practice: this job holds no token that can push, and
# only .pipeline/review.md leaves the runner.
# Never a GitHub approval: an app approval would satisfy the Owner_approval ruleset, and then the
# Builder app could merge. Only the owner approves and merges.
on:
  workflow_call:
    inputs:
      issue:
        description: "The CR whose pull request (head cr/<issue>) is reviewed"
        required: true
        type: number
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      REVIEWER_APP_PRIVATE_KEY:
        required: true
    outputs:
      verdict:
        description: "approve | changes | failed"
        value: ${{ jobs.post.outputs.verdict }}

permissions: {}

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: read
      pull-requests: read
    env:
      ISSUE: ${{ inputs.issue }}
    outputs:
      pr: ${{ steps.prompt.outputs.pr }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            api.anthropic.com:443
            claude.ai:443
            downloads.claude.ai:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443
          disable-sudo-and-containers: true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'
      - name: Tools for the evidence and the Inspector's allowlist
        run: python -m pip install --require-hashes -r host_tools/requirements.lock
      - name: Scripted evidence, then the prompt (the agent definition, the CR, evidence, diff)
        id: prompt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "cr/$ISSUE" --state open --json number --jq '.[0].number')
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          base=$(git merge-base origin/main "origin/cr/$ISSUE")
          python host_tools/test_first.py --repo . --base "$base" --head "origin/cr/$ISSUE" -- \
            python -m pytest host_tools -q > "$RUNNER_TEMP/evidence.json"
          {
            python -c 'import sys; t=open(sys.argv[1], encoding="utf-8").read(); print(t.split("---", 2)[2].strip())' .claude/agents/inspector.md
            echo
            echo "## The CR (#$ISSUE), reviewed in pull request #$pr"
            echo
            gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json title,body --jq '"Title: " + .title + "\n\n" + .body'
            echo
            echo "## Scripted evidence: tests before code (python -m pytest host_tools -q)"
            echo
            cat "$RUNNER_TEMP/evidence.json"
            echo
            echo "## Commits"
            git log --format='- %h %s' --reverse "$base..origin/cr/$ISSUE"
            echo
            echo "## The diff (main...cr/$ISSUE)"
            echo
            git diff "$base...origin/cr/$ISSUE" | head -c 60000
          } > "$RUNNER_TEMP/prompt.md"
          delim="EOF_$(openssl rand -hex 8)"
          { echo "text<<$delim"; cat "$RUNNER_TEMP/prompt.md"; echo "$delim"; } >> "$GITHUB_OUTPUT"
          git switch --quiet --detach "origin/cr/$ISSUE"   # the agent reads the PR's code
      - name: Inspector agent
        uses: anthropics/claude-code-action@4d75e5f390ee76b2e09c1980ecc99ff3a2e088c8  # v1.0.275
        env:
          # Egress is blocked (.github/pipeline/egress.json): no telemetry.
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The Dispatcher reacts to CI started by the Builder app's push; allow that one bot only.
          allowed_bots: builder-github-app
          github_token: ${{ github.token }}   # read-only
          show_full_output: true
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: |
            --max-turns 60
            --disallowedTools "WebFetch,WebSearch,Edit,NotebookEdit"
            --allowedTools "Read,Glob,Grep,Write,Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(make test),Bash(python -m pytest host_tools:*)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: inspector-review-${{ inputs.issue }}-${{ github.run_attempt }}
          path: .pipeline/review.md
          if-no-files-found: ignore
          retention-days: 7

  post:
    needs: review
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      verdict: ${{ steps.post.outputs.verdict }}
    env:
      PR: ${{ needs.review.outputs.pr }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
          disable-sudo-and-containers: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        continue-on-error: true
        with:
          name: inspector-review-${{ inputs.issue }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/out
      - name: "Reviewer App token (issues and pull requests: write; contents: read)"
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          app-id: ${{ vars.REVIEWER_APP_ID }}
          private-key: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write
      - name: Post the review as a comment, return the verdict
        id: post
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REVIEW_RESULT: ${{ needs.review.result }}
        run: |
          f="$RUNNER_TEMP/out/review.md"
          first=$(head -n1 "$f" 2>/dev/null || true)
          case "$first" in
            "VERDICT: approve") verdict=approve ;;
            "VERDICT: changes") verdict=changes ;;
            *) verdict=failed ;;
          esac
          if [ "$REVIEW_RESULT" != "success" ]; then verdict=failed; fi
          if [ -n "$PR" ]; then
            { echo "## Inspector review"; echo
              echo "Independent, read-only agent ([run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)). Verdict: **$verdict**."
              echo; tail -n +2 "$f" 2>/dev/null || echo "No review was written."; } > "$RUNNER_TEMP/comment.md"
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
          fi
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
