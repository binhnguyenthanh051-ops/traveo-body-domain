name: host-ci

# Build + unit-test the hardware-independent modules on every push and PR.
# This is the host-side CI from EP.03 — it grows as testable modules are added.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_call:   # release.yml re-runs this exact gate before it tags

jobs:
  host-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # Unity test framework lives in vendor/unity

      - name: Show toolchain
        run: gcc --version

      - name: Build and run host unit tests
        run: make test

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Run static analysis (MISRA-oriented)
        run: make lint

  python-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install host-tool deps
        run: |
          python -m pip install --upgrade pip
          if [ -f host_tools/requirements.txt ]; then pip install -r host_tools/requirements.txt; fi
      # ADR-0023 D9: events.csv is the single source of truth for log event IDs.
      # A stale generated table does not fail loudly — it renders the wrong event
      # name for the right ID, i.e. a confidently wrong test result. Gate it.
      - name: Verify generated log event tables are current
        run: python host_tools/gen_log_events.py --check

      - name: Run Python tests (if any)
        run: |
          pip install pytest
          # No-op until host_tools/ has tests; -q so it passes cleanly when empty.
          pytest host_tools -q || [ $? -eq 5 ]   # exit 5 = "no tests collected"

  # Its own job, so it is its own required check on main (agent pipeline, build step 2).
  traceability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # DoD check 6: the committed report must match the code, and every area that
      # has been tagged must stay gap-free. Add a --gate per area as it is tagged.
      - name: Verify traceability report is current (tagged areas gap-free)
        run: python host_tools/trace_report.py --check --gate REQ-SECOC
