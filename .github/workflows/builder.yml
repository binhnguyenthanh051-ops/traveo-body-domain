name: builder

# The Builder (docs/design/agent-pipeline.md sections 2-3; ADR-0026). It has no trigger of its
# own: the Dispatcher (dispatcher.yml) calls it with one issue and a mode, and routes its result.
#
#   build    the agent: tests first, then code, as local commits    (OAuth token; GITHUB_TOKEN read-only)
#   publish  pushes the branch, opens the PR on a first build       (Builder App token, minted here)
#
# The agent's job holds no token that can write to GitHub. Labels are the Dispatcher's.
# Every action is pinned to a commit (section 13). Egress is audited, not yet blocked.
on:
  workflow_call:
    inputs:
      issue:
        description: "The CR or bug report"
        required: true
        type: number
      mode:
        description: "build (a ready CR) or rework (fix only what was reported)"
        required: true
        type: string
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      BUILDER_APP_PRIVATE_KEY:
        required: true
    outputs:
      result:
        description: "done | blocked | protected | failed"
        value: ${{ jobs.publish.outputs.result }}

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: read
      pull-requests: read
    env:
      ISSUE: ${{ inputs.issue }}
      MODE: ${{ inputs.mode }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            api.anthropic.com:443
            claude.ai:443
            downloads.claude.ai:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443
            azure.archive.ubuntu.com:80
            esm.ubuntu.com:443
            packages.microsoft.com:443
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'
      - name: Tools the Builder's allowlist runs
        run: |
          sudo apt-get update && sudo apt-get install -y cppcheck
          python -m pip install -r host_tools/requirements.txt pytest
      - name: Drop sudo and container access before any repository or agent code runs
        # ADR-0026 D7: with sudo or Docker, code run later in this job (a test the Builder
        # writes, then runs with `make test`) could flush harden-runner's firewall rules.
        # Same mechanism as harden-runner's disable-sudo-and-containers, after apt-get.
        run: |
          for sock in /var/run/docker.sock /run/containerd/containerd.sock; do
            if [ -e "$sock" ]; then sudo chmod 000 "$sock"; fi
          done
          sudo truncate -s 0 /etc/sudoers.d/runner
          if sudo -n true 2>/dev/null; then echo "::error::sudo still works"; exit 1; fi
          if docker info >/dev/null 2>&1; then echo "::error::Docker still works"; exit 1; fi
      - name: Branch and identity
        run: |
          git config user.name "traveo-builder[bot]"
          git config user.email "traveo-builder[bot]@users.noreply.github.com"
          if [ "$MODE" = "rework" ]; then
            git switch -c "cr/$ISSUE" "origin/cr/$ISSUE"
            git rev-parse HEAD > "$RUNNER_TEMP/base.txt"
          else
            git switch -c "cr/$ISSUE"
            git rev-parse origin/main > "$RUNNER_TEMP/base.txt"
          fi
      - name: The issue is what the owner approved (no edit by anyone else since ready)
        id: pinned
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # Challenger finding (2026-11-13): an app can edit a CR after the owner set `ready`.
          # The picker skips such a CR; this re-checks right before the agent reads the text.
          if python host_tools/cr_queue.py text-unchanged --owner "$OWNER" --issue "$ISSUE" > "$RUNNER_TEMP/pinned.txt"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            mkdir -p .pipeline
            { echo "STATUS: blocked"; echo; cat "$RUNNER_TEMP/pinned.txt"
              echo "Set ready again if the new text is right."; } > .pipeline/result.md
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Write the prompt (the agent definition, then the issue and findings as data)
        if: steps.pinned.outputs.ok == 'true'
        id: prompt
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REVIEWER: ${{ vars.REVIEWER_APP_SLUG }}
        run: |
          {
            python -c 'import sys; t=open(sys.argv[1], encoding="utf-8").read(); print(t.split("---", 2)[2].strip())' .claude/agents/builder.md
            echo
            echo "## The issue (#$ISSUE)"
            echo
            gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json title,body --jq '"Title: " + .title + "\n\n" + .body'
            if [ "$MODE" = "rework" ]; then
              pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "cr/$ISSUE" --state open --json number --jq '.[0].number')
              echo
              echo "## Rework: fix only what is reported below (pull request #$pr)"
              echo
              echo "### Failed checks"
              gh pr checks "$pr" --repo "$GITHUB_REPOSITORY" --json name,state --jq '.[] | select(.state=="FAILURE") | "- " + .name' || true
              echo
              echo "### Findings (comments by the owner and the Inspector only; anything else is ignored)"
              gh api "repos/$GITHUB_REPOSITORY/issues/$pr/comments" --paginate \
                --jq ".[] | select(.user.login == \"$OWNER\" or .user.login == \"$REVIEWER[bot]\") | \"---\n\" + .body"
            fi
          } > "$RUNNER_TEMP/prompt.md"
          delim="EOF_$(openssl rand -hex 8)"
          { echo "text<<$delim"; cat "$RUNNER_TEMP/prompt.md"; echo "$delim"; } >> "$GITHUB_OUTPUT"
      - name: Builder agent
        if: steps.pinned.outputs.ok == 'true'
        uses: anthropics/claude-code-action@4d75e5f390ee76b2e09c1980ecc99ff3a2e088c8  # v1.0.275
        env:
          # Egress is blocked (.github/pipeline/egress.json): no telemetry.
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The Dispatcher reacts to CI started by the Builder app's push; allow that one bot only.
          allowed_bots: builder-github-app
          github_token: ${{ github.token }}   # read-only: the agent cannot write to GitHub
          show_full_output: true              # the first run failed with no visible reason
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: |
            --max-turns 80
            --disallowedTools "WebFetch,WebSearch"
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(make test),Bash(make lint),Bash(python -m pytest host_tools:*),Bash(python host_tools/trace_report.py:*),Bash(python host_tools/gen_log_events.py --check),Bash(git status),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git commit:*)"
      - name: Bundle the new commits for the publish job
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp .pipeline/result.md "$RUNNER_TEMP/out/result.md" 2>/dev/null || echo "STATUS: blocked" > "$RUNNER_TEMP/out/result.md"
          base=$(cat "$RUNNER_TEMP/base.txt")
          cp "$RUNNER_TEMP/base.txt" "$RUNNER_TEMP/out/base.txt"   # publish checks the bundle against it
          if [ "$(git rev-list --count "$base..cr/$ISSUE")" -gt 0 ]; then
            git bundle create "$RUNNER_TEMP/out/cr.bundle" "cr/$ISSUE" "^$base"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: builder-output-${{ inputs.issue }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/out/
          retention-days: 7

  publish:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      result: ${{ steps.publish.outputs.result }}
    env:
      ISSUE: ${{ inputs.issue }}
      MODE: ${{ inputs.mode }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
          disable-sudo-and-containers: true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: builder-output-${{ inputs.issue }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/out
      - name: Builder App token (contents, issues, pull requests; nothing else)
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          app-id: ${{ vars.BUILDER_APP_ID }}
          private-key: ${{ secrets.BUILDER_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Push the branch; open the pull request on a first build
        id: publish
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          out="$RUNNER_TEMP/out"
          status=$(head -n1 "$out/result.md" 2>/dev/null || true)
          if [ "$BUILD_RESULT" != "success" ] || [ "$status" != "STATUS: done" ] || [ ! -f "$out/cr.bundle" ]; then
            { echo "Builder stopped on this issue (run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
              echo; echo "Build job: $BUILD_RESULT. Agent report:"; echo; tail -n +2 "$out/result.md" 2>/dev/null; } > "$RUNNER_TEMP/blocked.md"
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/blocked.md"
            if [ "$BUILD_RESULT" != "success" ]; then r=failed; else r=blocked; fi
            echo "result=$r" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$MODE" = "rework" ]; then git fetch --quiet origin "cr/$ISSUE"; fi
          # The agent wrote the bundle, so it is untrusted input (Challenger finding, 2026-11-13).
          # Its base must be where the build started: the branch head for rework, a commit of
          # main for a build. Then host_tools/bundle_check.py checks the bundle itself.
          base=$(cat "$out/base.txt" 2>/dev/null || true)
          refused=""
          if [ "$MODE" = "rework" ] && [ "$base" != "$(git rev-parse "origin/cr/$ISSUE")" ]; then
            refused="the rework base ${base:0:7} is not the current head of cr/$ISSUE"
          elif [ "$MODE" = "build" ] && ! git merge-base --is-ancestor "$base" origin/main 2>/dev/null; then
            refused="the build base ${base:0:7} is not a commit of main"
          elif ! python host_tools/bundle_check.py --bundle "$out/cr.bundle" --branch "cr/$ISSUE" \
                 --base "$base" > "$RUNNER_TEMP/bundle.txt"; then
            refused=$(cat "$RUNNER_TEMP/bundle.txt")
          fi
          if [ -n "$refused" ]; then
            { echo "The publish job refused the Builder's commits (run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID); nothing was pushed."
              echo; echo "$refused"; } > "$RUNNER_TEMP/blocked.md"
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/blocked.md"
            echo "result=blocked" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --quiet "$out/cr.bundle" "cr/$ISSUE:cr/$ISSUE"
          git diff --name-only "origin/main...cr/$ISSUE" > "$RUNNER_TEMP/changed.txt"
          protected=0
          python host_tools/protected_paths.py --changed "$RUNNER_TEMP/changed.txt" || protected=1
          git push --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "cr/$ISSUE"
          if [ "$MODE" = "build" ]; then
            { tail -n +2 "$out/result.md"; echo; echo "Closes #$ISSUE."; } > "$RUNNER_TEMP/pr.md"
            title=$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json title --jq .title)
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "cr/$ISSUE" --title "$title (#$ISSUE)" --body-file "$RUNNER_TEMP/pr.md"
          fi
          if [ "$protected" = 1 ]; then echo "result=protected" >> "$GITHUB_OUTPUT"; else echo "result=done" >> "$GITHUB_OUTPUT"; fi
