name: builder

# The Builder (docs/design/agent-pipeline.md section 3; ADR-0026). Nightly at 01:00 SGT,
# or by hand. One CR per run: the oldest issue that is agent-ready.
#
# Four jobs, so the agent never holds a token that can write to GitHub:
#   pick     reads the queue, moves the label ready -> building    (GITHUB_TOKEN, issues: write)
#   build    the agent: tests first, then code, as local commits    (OAuth token; GITHUB_TOKEN read-only)
#   publish  pushes the branch and opens the pull request           (Builder App token, minted here)
#   report   one status line, also when nothing was done            (GITHUB_TOKEN, issues: write)
# Every action is pinned to a commit (section 13). Egress is audited, not yet blocked:
# the allowlist is measured on the first runs, then a follow-up CR switches to block.
on:
  schedule:
    - cron: "0 17 * * *"   # 17:00 UTC = 01:00 SGT
  workflow_dispatch:

permissions: {}

concurrency:
  group: builder
  cancel-in-progress: false

jobs:
  pick:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    outputs:
      issue: ${{ steps.pick.outputs.issue }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: Pick the oldest agent-ready CR
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          python host_tools/cr_queue.py pick --owner "$OWNER" > "$RUNNER_TEMP/pick.json"
          cat "$RUNNER_TEMP/pick.json"
          issue=$(python -c 'import json,sys; v=json.load(open(sys.argv[1]))["issue"]; print(v or "")' "$RUNNER_TEMP/pick.json")
          echo "issue=$issue" >> "$GITHUB_OUTPUT"
          python -c 'import json,sys
          for n, why in json.load(open(sys.argv[1]))["skipped"]:
              print(f"- skipped #{n}: {why}")' "$RUNNER_TEMP/pick.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Move the label ready -> building
        if: steps.pick.outputs.issue != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.pick.outputs.issue }}
        run: gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label ready --add-label building

  build:
    needs: pick
    if: needs.pick.outputs.issue != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: read
      pull-requests: read
    env:
      ISSUE: ${{ needs.pick.outputs.issue }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'
      - name: Tools the Builder's allowlist runs
        run: |
          sudo apt-get update && sudo apt-get install -y cppcheck
          python -m pip install -r host_tools/requirements.txt pytest
      - name: Branch and identity
        run: |
          git config user.name "traveo-builder[bot]"
          git config user.email "traveo-builder[bot]@users.noreply.github.com"
          git switch -c "cr/$ISSUE"
      - name: Write the prompt (the agent definition, then the issue as data)
        id: prompt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            python -c 'import sys; t=open(sys.argv[1], encoding="utf-8").read(); print(t.split("---", 2)[2].strip())' .claude/agents/builder.md
            echo
            echo "## The issue (#$ISSUE)"
            echo
            gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json title,body --jq '"Title: " + .title + "\n\n" + .body'
          } > "$RUNNER_TEMP/prompt.md"
          delim="EOF_$(openssl rand -hex 8)"
          { echo "text<<$delim"; cat "$RUNNER_TEMP/prompt.md"; echo "$delim"; } >> "$GITHUB_OUTPUT"
      - name: Builder agent
        uses: anthropics/claude-code-action@4d75e5f390ee76b2e09c1980ecc99ff3a2e088c8  # v1.0.275
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}   # read-only: the agent cannot write to GitHub
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: |
            --max-turns 80
            --disallowedTools "WebFetch,WebSearch"
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(make test),Bash(make lint),Bash(python -m pytest host_tools:*),Bash(python host_tools/trace_report.py:*),Bash(python host_tools/gen_log_events.py --check),Bash(git status),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git commit:*)"
      - name: Bundle the commits for the publish job
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp .pipeline/result.md "$RUNNER_TEMP/out/result.md" 2>/dev/null || echo "STATUS: blocked" > "$RUNNER_TEMP/out/result.md"
          if [ "$(git rev-list --count "origin/main..cr/$ISSUE")" -gt 0 ]; then
            git bundle create "$RUNNER_TEMP/out/cr.bundle" "cr/$ISSUE" ^origin/main
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: builder-output
          path: ${{ runner.temp }}/out/
          retention-days: 7

  publish:
    needs: [pick, build]
    if: always() && needs.pick.outputs.issue != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      outcome: ${{ steps.publish.outputs.outcome }}
    env:
      ISSUE: ${{ needs.pick.outputs.issue }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: builder-output
          path: ${{ runner.temp }}/out
      - name: Builder App token (contents, issues, pull requests; nothing else)
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          app-id: ${{ vars.BUILDER_APP_ID }}
          private-key: ${{ secrets.BUILDER_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Push the branch and open the pull request
        id: publish
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          out="$RUNNER_TEMP/out"
          status=$(head -n1 "$out/result.md" 2>/dev/null || true)
          if [ "$BUILD_RESULT" != "success" ] || [ "$status" != "STATUS: done" ] || [ ! -f "$out/cr.bundle" ]; then
            { echo "Builder stopped on this issue (run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
              echo; echo "Build job: $BUILD_RESULT. Agent report:"; echo; tail -n +2 "$out/result.md" 2>/dev/null; } > "$RUNNER_TEMP/blocked.md"
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/blocked.md"
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label building --add-label waiting-for-me
            echo "outcome=blocked on #$ISSUE ($BUILD_RESULT, ${status:-no report})" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --quiet "$out/cr.bundle" "cr/$ISSUE:cr/$ISSUE"
          git diff --name-only "origin/main...cr/$ISSUE" > "$RUNNER_TEMP/changed.txt"
          protected=0
          python host_tools/protected_paths.py --changed "$RUNNER_TEMP/changed.txt" || protected=1
          git push --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "cr/$ISSUE"
          { tail -n +2 "$out/result.md"; echo; echo "Closes #$ISSUE. Rework round 0 of 2."; } > "$RUNNER_TEMP/pr.md"
          title=$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json title --jq .title)
          url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "cr/$ISSUE" --title "$title (#$ISSUE)" --body-file "$RUNNER_TEMP/pr.md")
          if [ "$protected" = 1 ]; then
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "The change touches a protected path, so it waits for the owner's referee call: $url"
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label building --add-label waiting-for-me
            echo "outcome=$url (protected path, waiting-for-me)" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=$url" >> "$GITHUB_OUTPUT"
          fi

  report:
    needs: [pick, build, publish]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: audit
      - name: One status line per run (section 6), also when nothing was done
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.pick.outputs.issue }}
          PICK: ${{ needs.pick.result }}
          OUTCOME: ${{ needs.publish.outputs.outcome }}
        run: |
          when=$(date -u +%Y-%m-%dT%H:%MZ)
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$PICK" != "success" ]; then line="pick failed"
          elif [ -z "$ISSUE" ]; then line="no ready CR"
          else line="#$ISSUE: ${OUTCOME:-publish failed}"; fi
          echo "$when builder: $line ([run]($run))" | tee -a "$GITHUB_STEP_SUMMARY" > "$RUNNER_TEMP/line.md"
          status_issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title "Pipeline status"' --json number,title --jq '[.[] | select(.title == "Pipeline status")][0].number // empty')
          if [ -z "$status_issue" ]; then
            status_issue=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "Pipeline status" --body "One line per pipeline run (docs/design/agent-pipeline.md section 6). No line means the pipeline is down." | sed 's#.*/##')
          fi
          gh issue comment "$status_issue" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/line.md"
