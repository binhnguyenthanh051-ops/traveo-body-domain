name: dispatcher

# The Dispatcher (docs/design/agent-pipeline.md section 3): the one workflow that owns every
# trigger. No agent has a trigger of its own. It is deterministic, not an agent: it reads
# labels, events and who acted (host_tools/dispatcher.py), never issue or comment text.
#
#   route   decide the next step, change labels       (GITHUB_TOKEN: issues write, nothing else)
#   builder   the Builder, when the route says build or rework  (builder.yml)
#   inspector the Inspector, when the route says inspect          (inspector.yml)
#   planner   the Planner, when the route says plan-*             (planner.yml)
#   challenger the Challenger, on `challenge` or after a breakdown (challenger.yml), advice only
#   settle    route the agent's result, change labels
#   status  one status line per run, also when nothing was done, on the "Pipeline status" issue
#
# The pause switch is the repository variable PIPELINE_PAUSED=true, which only an admin can set.
# Code always comes from the default branch, never from a pull request.
on:
  schedule:
    - cron: "0 17 * * *"   # 17:00 UTC = 01:00 SGT
  workflow_dispatch:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [host-ci]
    types: [completed]
  pull_request:
    types: [closed, labeled]
  status:

permissions: {}

jobs:
  route:
    # Its own status comments, and every bot's comment, would only feed the loop back.
    if: github.event_name != 'issue_comment' || github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    outputs:
      issue: ${{ steps.route.outputs.issue }}
      start: ${{ steps.route.outputs.start }}
      line: ${{ steps.route.outputs.line }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'
      - name: Route the event
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          PAUSED: ${{ vars.PIPELINE_PAUSED == 'true' && '--paused' || '' }}
        run: |
          python host_tools/dispatcher.py decide --event-name "$GITHUB_EVENT_NAME" \
            --event-path "$GITHUB_EVENT_PATH" --owner "$OWNER" $PAUSED \
            --planner-login "${{ vars.REVIEWER_APP_SLUG }}[bot]" > "$RUNNER_TEMP/decision.json"
          python host_tools/dispatch_apply.py "$RUNNER_TEMP/decision.json" >> "$GITHUB_OUTPUT"

  builder:
    needs: route
    if: needs.route.outputs.start == 'build' || needs.route.outputs.start == 'rework'
    concurrency:
      group: builder-${{ needs.route.outputs.issue }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: ./.github/workflows/builder.yml
    with:
      issue: ${{ fromJSON(needs.route.outputs.issue) }}
      mode: ${{ needs.route.outputs.start }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      BUILDER_APP_PRIVATE_KEY: ${{ secrets.BUILDER_APP_PRIVATE_KEY }}

  inspector:
    needs: route
    if: needs.route.outputs.start == 'inspect'
    concurrency:
      group: inspector-${{ needs.route.outputs.issue }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: ./.github/workflows/inspector.yml
    with:
      issue: ${{ fromJSON(needs.route.outputs.issue) }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      REVIEWER_APP_PRIVATE_KEY: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}

  planner:
    needs: route
    if: needs.route.outputs.start == 'plan-breakdown' || needs.route.outputs.start == 'plan-bug'
    concurrency:
      group: planner-${{ needs.route.outputs.issue }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: read
    uses: ./.github/workflows/planner.yml
    with:
      issue: ${{ fromJSON(needs.route.outputs.issue) }}
      mode: ${{ needs.route.outputs.start }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      REVIEWER_APP_PRIVATE_KEY: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}

  settle:
    needs: [route, builder, inspector, planner]
    if: always() && (needs.builder.result != 'skipped' || needs.inspector.result != 'skipped' || needs.planner.result != 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    outputs:
      line: ${{ steps.settle.outputs.line }}
      start: ${{ steps.settle.outputs.start }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'
      - name: Route the agent's result
        id: settle
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          ISSUE: ${{ needs.route.outputs.issue }}
          AGENT: ${{ needs.builder.result != 'skipped' && 'builder' || (needs.inspector.result != 'skipped' && 'inspector' || 'planner') }}
          RESULT: ${{ needs.builder.result != 'skipped' && (needs.builder.outputs.result || 'failed') || (needs.inspector.result != 'skipped' && (needs.inspector.outputs.verdict || 'failed') || (needs.planner.outputs.result || 'failed')) }}
          PAUSED: ${{ vars.PIPELINE_PAUSED == 'true' && '--paused' || '' }}
        run: |
          python host_tools/dispatcher.py settle --issue "$ISSUE" "--$AGENT" "$RESULT" \
            --mode "${{ needs.route.outputs.start }}" --owner "$OWNER" $PAUSED > "$RUNNER_TEMP/decision.json"
          python host_tools/dispatch_apply.py "$RUNNER_TEMP/decision.json" >> "$GITHUB_OUTPUT"

  challenger:
    # Row 18 (the owner's challenge label) or row 19 (a finished breakdown). Advice only.
    needs: [route, settle]
    if: always() && (needs.route.outputs.start == 'challenge-design' || needs.settle.outputs.start == 'challenge-breakdown')
    concurrency:
      group: challenger-${{ needs.route.outputs.issue }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: ./.github/workflows/challenger.yml
    with:
      issue: ${{ fromJSON(needs.route.outputs.issue) }}
      mode: ${{ needs.route.outputs.start == 'challenge-design' && 'challenge-design' || 'challenge-breakdown' }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      REVIEWER_APP_PRIVATE_KEY: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}

  status:
    needs: [route, builder, inspector, planner, settle, challenger]
    if: always() && needs.route.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: audit
      - name: One status line per run (section 6), also when nothing was done
        env:
          GH_TOKEN: ${{ github.token }}
          ROUTE: ${{ needs.route.outputs.line || format('route job {0}', needs.route.result) }}
          SETTLE: ${{ needs.settle.outputs.line }}
          CHALLENGER: ${{ needs.challenger.result != 'skipped' && (needs.challenger.outputs.result || 'failed') || '' }}
        run: |
          when=$(date -u +%Y-%m-%dT%H:%MZ)
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          line="$ROUTE"
          if [ -n "$SETTLE" ]; then line="$line; then $SETTLE"; fi
          # Row 20: the Challenger's result changes no label; it is only reported.
          if [ -n "$CHALLENGER" ]; then line="$line; Challenger $CHALLENGER"; fi
          echo "$when dispatcher [$GITHUB_EVENT_NAME]: $line ([run]($run))" | tee -a "$GITHUB_STEP_SUMMARY" > "$RUNNER_TEMP/line.md"
          status_issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title "Pipeline status"' --json number,title --jq '[.[] | select(.title == "Pipeline status")][0].number // empty')
          if [ -z "$status_issue" ]; then
            status_issue=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "Pipeline status" --body "One line per Dispatcher run (docs/design/agent-pipeline.md section 6). No line means the pipeline is down." | sed 's#.*/##')
          fi
          gh issue comment "$status_issue" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/line.md"
