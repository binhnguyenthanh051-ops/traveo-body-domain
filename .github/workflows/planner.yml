name: planner

# The Planner (docs/design/agent-pipeline.md sections 2-3, rows 14-17; ADR-0026). No trigger of
# its own: the Dispatcher calls it when the owner adds plan:breakdown or plan:bug.
#
#   plan     the agent: reads the source issue, the ADR and the requirements; writes a plan file
#            (OAuth token; GITHUB_TOKEN read-only; no push, no Bash)
#   publish  checks the plan against the issue-form contract, creates the drafts and the summary
#            comment with the Reviewer App token (host_tools/planner_publish.py)
on:
  workflow_call:
    inputs:
      issue:
        description: "The source issue that was labelled plan:breakdown or plan:bug"
        required: true
        type: number
      mode:
        description: "plan-breakdown or plan-bug"
        required: true
        type: string
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      REVIEWER_APP_PRIVATE_KEY:
        required: true
    outputs:
      result:
        description: "done | blocked | failed"
        value: ${{ jobs.publish.outputs.result }}

permissions: {}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
    env:
      ISSUE: ${{ inputs.issue }}
      MODE: ${{ inputs.mode }}
      # Owner's review of #52: without the scrub, make test and any code the agent runs
      # could read the OAuth token (host_tools/tests/test_agent_env.py observes it). Job
      # level, as the action reads both through the env context.
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
      # Egress is blocked (.github/pipeline/egress.json): no telemetry.
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            api.anthropic.com:443
            claude.ai:443
            downloads.claude.ai:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
          disable-sudo-and-containers: true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Write the prompt (the agent definition, the mode, then the source issue as data)
        id: prompt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            python -c 'import sys; t=open(sys.argv[1], encoding="utf-8").read(); print(t.split("---", 2)[2].strip())' .claude/agents/planner.md
            echo
            echo "## Mode: ${MODE#plan-}"
            echo
            echo "## The source issue (#$ISSUE)"
            echo
            gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json title,body --jq '"Title: " + .title + "\n\n" + .body'
            echo
            echo "## Existing milestones"
            gh api "repos/$GITHUB_REPOSITORY/milestones?state=open" --jq '.[] | "- " + .title'
          } > "$RUNNER_TEMP/prompt.md"
          delim="EOF_$(openssl rand -hex 8)"
          { echo "text<<$delim"; cat "$RUNNER_TEMP/prompt.md"; echo "$delim"; } >> "$GITHUB_OUTPUT"
      - name: Planner agent
        uses: anthropics/claude-code-action@4d75e5f390ee76b2e09c1980ecc99ff3a2e088c8  # v1.0.275
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The Dispatcher reacts to CI started by the Builder app's push; allow that one bot only.
          allowed_bots: builder-github-app
          github_token: ${{ github.token }}   # read-only
          show_full_output: true
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: |
            --max-turns 40
            --disallowedTools "WebFetch,WebSearch,Edit,NotebookEdit,Bash"
            --allowedTools "Read,Glob,Grep,Write"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: planner-plan-${{ inputs.issue }}-${{ github.run_attempt }}
          path: .pipeline/plan.json
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: plan
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      result: ${{ steps.publish.outputs.result }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
          disable-sudo-and-containers: true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        continue-on-error: true
        with:
          name: planner-plan-${{ inputs.issue }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/out
      - name: "Reviewer App token (issues: write; contents: read)"
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          app-id: ${{ vars.REVIEWER_APP_ID }}
          private-key: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: write
      - name: Check the plan, create the drafts, post the list
        id: publish
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PLAN_RESULT: ${{ needs.plan.result }}
        run: |
          # A failed agent run publishes nothing, even if it left a partial plan behind.
          if [ "$PLAN_RESULT" != "success" ]; then
            gh issue comment "${{ inputs.issue }}" --body "Planner run failed ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID); nothing was created."
            echo "result=failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python host_tools/planner_publish.py "$RUNNER_TEMP/out/plan.json" --source "${{ inputs.issue }}" | tee -a "$GITHUB_OUTPUT"
