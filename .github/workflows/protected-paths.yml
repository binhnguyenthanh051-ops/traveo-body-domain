name: protected-paths

# docs/design/agent-pipeline.md section 7: a pull request that touches a protected path
# fails, unless the owner added the label `protected-change-approved`. Adding or removing
# the label re-runs the check.
#
# The checker and its pattern list come from the BASE branch, so a pull request cannot
# weaken the check that judges it. Only the list of changed files comes from the PR.
# Actions are pinned to a commit (section 13); the token can only read.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  protected-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'

      - name: List the changed files (both names of a rename)
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/changed.txt"
          cat "$RUNNER_TEMP/changed.txt"

      - name: Check the protected paths
        env:
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'protected-change-approved') }}
        run: |
          # Bootstrap only: the PR that adds this check has no checker on its base yet.
          if [ ! -f host_tools/protected_paths.py ]; then
            echo "::warning::No checker on the base branch; using the PR's own copy (first run only)"
            git fetch --quiet --depth=1 origin "${{ github.event.pull_request.head.sha }}"
            git checkout --quiet FETCH_HEAD -- host_tools/protected_paths.py .github/pipeline/protected-paths.txt
          fi
          flag=""
          if [ "$APPROVED" = "true" ]; then flag="--approved"; fi
          python host_tools/protected_paths.py --changed "$RUNNER_TEMP/changed.txt" $flag
